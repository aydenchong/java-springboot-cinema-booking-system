services:
  postgres:
    image: postgres:17
    container_name: cinereserve-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cinereserve
      POSTGRES_USER: cinereserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinereserve -d cinereserve"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
